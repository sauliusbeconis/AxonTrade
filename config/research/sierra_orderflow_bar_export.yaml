schema_version: 1
profile_id: sierra_orderflow_bar_export_v1
description: >
  Normalization contract for Sierra Chart bar/study exports that include
  bid/ask volume fields needed by liquidity sweep absorption research.

normalized_fields:
  - timestamp
  - symbol
  - chart_number
  - bar_index
  - open
  - high
  - low
  - close
  - volume
  - vwap
  - opening_range_high
  - opening_range_low
  - bid_volume
  - ask_volume
  - delta
  - session_phase

optional_fields:
  - volume
  - delta

defaults:
  chart_number: 1
  session_phase: rth

required_cli_values:
  - symbol

column_aliases:
  timestamp:
    - Date Time
    - DateTime
    - Date-Time
    - Timestamp
    - Date
  symbol:
    - Symbol
  chart_number:
    - Chart Number
    - ChartNumber
  bar_index:
    - Bar Index
    - BarIndex
    - Index
  open:
    - Open
    - O
  high:
    - High
    - H
  low:
    - Low
    - L
  close:
    - Last
    - Close
    - C
  volume:
    - Volume
    - Vol
    - Total Volume
  vwap:
    - VWAP
    - Volume Weighted Average Price
    - Volume Weighted Average Price VWAP
    - Volume Weighted Average Price - VWAP
    - VWAP SG1
  opening_range_high:
    - Opening Range High
    - OR High
    - Open Range High
    - High/Low for Time Period High
    - High Low for Time Period High
  opening_range_low:
    - Opening Range Low
    - OR Low
    - Open Range Low
    - High/Low for Time Period Low
    - High Low for Time Period Low
  bid_volume:
    - Bid Volume
    - BidVolume
    - Bid Vol
    - Total Bid Volume
    - Number Bars Bid Volume
  ask_volume:
    - Ask Volume
    - AskVolume
    - Ask Vol
    - Total Ask Volume
    - Number Bars Ask Volume
  delta:
    - Delta
    - Ask - Bid
    - Ask-Bid
    - Ask Bid Difference
    - Ask Volume Bid Volume Difference
    - Ask Volume - Bid Volume
    - Ask Volume Bid Volume Diff
  session_phase:
    - Session Phase
    - Session

notes:
  - bid_volume and ask_volume are required for the first absorption layer.
  - delta is optional because the evaluator can compute ask_volume - bid_volume.
  - volume is optional because the evaluator can fall back to ask_volume + bid_volume.
  - The default runner computes opening_range_high and opening_range_low from
    exported bars instead of trusting Sierra study columns.
