name: AxonTrade CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Runs before the dev dependencies are installed on purpose.
      # check_repo.sh skips pytest and ruff when they are not importable, so at
      # this point it executes the ACSIL order-routing safety scan and nothing
      # else. That scan is the one check that must hard-fail: it asserts that
      # sc.BuyEntry/sc.SellEntry/sc.FlattenAndCancelAllOrders and friends appear
      # only in the single approved execution harness.
      - name: ACSIL order-routing safety scan
        run: bash scripts/check_repo.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      # Blocking. The rule set is pinned in pyproject.toml rather than inherited
      # from ruff's defaults, so a new ruff release cannot turn this red without
      # a project change. Rules requiring behavioural decisions are documented
      # there as an excluded backlog rather than silently ignored.
      - name: Lint
        run: ruff check src tests scripts
